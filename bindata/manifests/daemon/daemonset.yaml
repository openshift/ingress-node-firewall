apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ingress-node-firewall-daemon
  namespace: '{{.NameSpace}}'
spec:
  selector:
    matchLabels:
      app: ingress-node-firewall-daemon
    updateStrategy:
      type: RollingUpdate
  template:
    metadata:
      labels:
        app: ingress-node-firewall-daemon
        component: daemon
        type: infra
    spec:
      hostNetwork: true
      hostPID: true
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      priorityClassName: "system-node-critical"
      containers:
        - name: daemon
          image: '{{.Image}}'
          command: ["/usr/bin/daemon"]
          args:
            - --metrics-bind-address=:9301
            - --metrics-cert-dir=/etc/pki/tls/metrics-certs
            - --metrics-secure=true
            - --metrics-tls-min-version={{.TLSMinVersion}}
            - --metrics-tls-cipher-suites={{default "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384" .TLSCipherSuites}}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POLL_PERIOD_SECONDS
              value: "30"
            - name: ENABLE_EBPF_LPM_LOOKUP_DBG
              value: '{{.Debug}}'
            - name: EBPF_MANAGEMENT_MODE
              value: '{{.EBPFProgramManagerMode}}'
          ports:
            - containerPort: 9301
              name: metrics
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: syslog-socket
              mountPath: /var/run
            - name: ingress-node-firewall-daemon-metrics-certs
              mountPath: /etc/pki/tls/metrics-certs
              readOnly: true
        - name: events
          image: '{{.Image}}'
          command: ["/usr/bin/syslog"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: syslog-socket
              mountPath: /var/run
      volumes:
        - name: ingress-node-firewall-daemon-metrics-certs
          secret:
            secretName: ingress-node-firewall-daemon-metrics-certs
        - name: syslog-socket
          path: /var/run
      serviceAccountName: ingress-node-firewall-daemon
