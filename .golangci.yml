version: "2"
linters:
  default: standard
  disable:
    - depguard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (*io.PipeWriter).Close
        - (*crypto/tls.Conn).Close
        - (io.WriteCloser).Close
        - (net.Conn).Close
        - (net.Listener).Close
    staticcheck:
      checks:
        - "all"
        - "-SA1019"
        - "-SA4010"
        - "-S1039"
        - "-QF1001"
        - "-QF1003"
        - "-QF1008"
        - "-ST1000"
        - "-ST1001"
        - "-ST1003"
        - "-ST1005"
        - "-ST1019"
        - "-ST1020"
        - "-ST1021"
