version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*net.TCPListener).Close
        - (*crypto/tls.Conn).Close
        - (io.ReadCloser).Close
        - (io.WriteCloser).Close
        - (*io.PipeWriter).Close
    staticcheck:
      checks:
        - "all"
        - "-QF1001"
        - "-QF1003"
        - "-QF1008"
        - "-ST1000"
        - "-ST1001"
        - "-ST1003"
        - "-ST1020"
        - "-ST1021"
