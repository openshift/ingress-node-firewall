version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (*io.PipeWriter).Close
        - (net.Conn).Close
        - (net.Listener).Close
    staticcheck:
      checks:
        - "all"
        - "-SA1019"
        - "-QF1008"
        - "-QF1001"
        - "-QF1003"
        - "-ST1000"
        - "-ST1001"
        - "-ST1003"
        - "-ST1020"
        - "-ST1021"

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: test/
      linters:
        - errcheck
