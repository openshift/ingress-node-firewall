version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (io.Closer).Close
        - (net.Conn).Close
    staticcheck:
      checks:
        - "all"
        - "-QF1001"
        - "-QF1003"
        - "-QF1008"
        - "-SA1019"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: test/
        linters:
          - errcheck
          - ST1001
