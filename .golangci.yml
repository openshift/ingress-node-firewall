version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (io.WriteCloser).Close
        - (net.Conn).Close
        - (net.Listener).Close
    staticcheck:
      checks:
        - "all"
        - "-QF1008"
        - "-QF1001"
        - "-QF1003"
        - "-ST1001"
