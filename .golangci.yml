version: "2"
linters:
  default: standard
  exclusions:
    rules:
      - linters:
          - errcheck
        text: "Error return value of .*(Close|Fprintln|Fprintf).*is not checked"
      - linters:
          - staticcheck
        text: "QF1001|QF1003|QF1008|ST1001"
      - linters:
          - staticcheck
        text: "SA1019.*scheme.Builder"
