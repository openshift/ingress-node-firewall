version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (net.Conn).Close
        - (net.Listener).Close
        - (io.Closer).Close
        - (*os.File).Close
        - (io.ReadCloser).Close
