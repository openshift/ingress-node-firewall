version: "2"

linters:
  default: standard
  settings:
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST*"
  exclusions:
    rules:
      - linters: [errcheck]
        text: "Error return value of .*.Close"
      - linters: [errcheck]
        text: "Error return value of `fmt.Fprint"
      - linters: [staticcheck]
        text: "SA1019: scheme.Builder is deprecated"
    paths:
      - third_party
      - builtin
