version: "2"
linters:
  default: standard
  exclusions:
    presets:
      - std-error-handling
    rules:
      - linters: [errcheck]
        path: _test\.go
      - linters: [staticcheck]
        text: "ST1001"
      - linters: [staticcheck]
        text: "QF1001"
      - linters: [staticcheck]
        text: "QF1003"
      - linters: [staticcheck]
        text: "QF1008"
      - linters: [staticcheck]
        text: "SA1019.*scheme.Builder"
    paths:
      - third_party
      - vendor
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (*net.Listener).Close
