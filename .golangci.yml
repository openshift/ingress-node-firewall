version: "2"
linters:
  default: standard
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters: [errcheck]
        path: _test\.go
      - linters: [staticcheck]
        text: "ST1001"
        path: test/
      - linters: [staticcheck]
        text: "QF1008"
      - linters: [staticcheck]
        text: "QF1001"
      - linters: [staticcheck]
        text: "QF1003"
