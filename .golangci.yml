version: "2"

linters:
  default: standard
  disable:
    - QF1001
    - QF1003
    - QF1008
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (io.Closer).Close
        - (io.WriteCloser).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*net.TCPListener).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*bufio.Writer).Flush
    staticcheck:
      checks:
        - "all"
        - "-ST1001"
