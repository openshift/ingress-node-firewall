version: "2"
linters:
  default: standard
  exclusions:
    rules:
      - linters: [staticcheck]
        text: "QF1001|QF1003|QF1008"
      - linters: [staticcheck]
        text: "ST1001"
      - linters: [staticcheck]
        text: "ST1019"
      - linters: [staticcheck]
        text: "SA1019"
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*io.PipeWriter).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*os.File).Close
        - (io.WriteCloser).Close
        - (*crypto/tls.Conn).Close
